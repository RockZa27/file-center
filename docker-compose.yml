# ย้ายเครื่อง: คัดลอกโฟลเดอร์โปรเจกต์ทั้งหมด (รวม ./data และ .env) ไปเครื่องใหม่ แล้วรัน  docker compose up -d --build

# log ของคอนเทนเนอร์เก็บไม่เกิน 3 ไฟล์ x 10 MB ต่อคอนเทนเนอร์ (ค่าเริ่มต้นของ Docker ไม่จำกัด)
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  file-center:
    build: .
    container_name: file-center
    restart: unless-stopped
    logging: *logging
    ports:
      # ค่าเริ่มต้นเปิดให้เข้าได้จากเครื่องนี้เท่านั้น ผู้ใช้ภายนอกเข้าผ่านโดเมน (Cloudflare Tunnel) โดยไม่ต้องเปิดพอร์ตที่เราเตอร์
      # ตั้ง BIND_ADDRESS=0.0.0.0 ใน .env ถ้าต้องการให้เครื่องอื่นในวง LAN เข้าตรงได้
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    # แอปทำงานเป็นผู้ใช้ bun (uid 1000) ไม่ใช่ root ถ้าจำเป็นต้องใช้ root ให้ตั้ง FC_RUN_AS_ROOT=true ใน .env (ดู README)
    environment:
      # PORT ใน .env คือพอร์ตฝั่งเครื่อง host ส่วนในคอนเทนเนอร์ใช้ 3000 เสมอ
      PORT: "3000"
      # the tunnel token in .env belongs to cloudflared only; the app (and any update installed from the web) must never see it
      TUNNEL_TOKEN: ""
    volumes:
      # ./data/storage = ไฟล์ที่อัปโหลด, ./data/system = ผู้ใช้ ตั้งค่า ประวัติ ถังขยะ session
      - ./data:/data
    # เสริมความปลอดภัยของคอนเทนเนอร์ (ดูหัวข้อ "ตั้งค่าความปลอดภัยของคอนเทนเนอร์" ใน README ว่าถ้า host ใช้ไม่ได้ให้แก้อะไร)
    # ระบบไฟล์ของอิมเมจอ่านอย่างเดียว เขียนได้เฉพาะ /data (ข้อมูล และเวอร์ชันที่อัปเดตจากเว็บใน /data/system/app) กับ /tmp
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    # ตัดสิทธิ์ทั้งหมดออก เหลือเท่าที่ entrypoint ต้องใช้ตอนเริ่ม (chown -R ครั้งเดียวแล้วลดเป็น bun ด้วย setpriv):
    #   CHOWN = เปลี่ยนเจ้าของ ./data ของการติดตั้งเก่า, SETUID/SETGID = ลดจาก root เป็น bun (และตั้งกลุ่ม),
    #   DAC_OVERRIDE = อ่าน/เดินเข้าโฟลเดอร์ใน ./data ที่เป็นของผู้ใช้อื่นและปิดสิทธิ์ไว้ (ตอน chown และตอน FC_RUN_AS_ROOT=true)
    # หลังลดเป็น bun แล้ว แอปไม่เหลือสิทธิ์เลย
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    # กันแอปกินเครื่องทั้งเครื่อง ปรับได้ใน .env (FC_MEMORY_LIMIT=4g, FC_PIDS_LIMIT=1024)
    mem_limit: ${FC_MEMORY_LIMIT:-2g}
    pids_limit: ${FC_PIDS_LIMIT:-512}

  # Cloudflare Tunnel พาผู้ใช้จากโดเมนเข้ามาที่ file-center โดยไม่ต้องเปิดพอร์ตหรือมี IP จริง
  # ทำงานเมื่อ .env มี COMPOSE_PROFILES=tunnel และ TUNNEL_TOKEN (ดูหัวข้อ Cloudflare Tunnel ใน README)
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: file-center-tunnel
    profiles: [tunnel]
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      file-center:
        condition: service_healthy

  # ONLYOFFICE Docs (Community) เปิด/แก้ไฟล์ docx xlsx pptx ในหน้าเว็บ ใช้ RAM ราว 2–4 GB
  # ทำงานเมื่อ .env มี COMPOSE_PROFILES=office (หรือ tunnel,office) พร้อม OFFICE_URL, OFFICE_INTERNAL_URL และ OFFICE_JWT_SECRET (ดู README)
  onlyoffice:
    image: onlyoffice/documentserver:9.4.0
    container_name: file-center-office
    profiles: [office]
    restart: unless-stopped
    logging: *logging
    ports:
      # เบราว์เซอร์โหลดโปรแกรมแก้ไขจากที่นี่ (ผ่าน OFFICE_URL) เปิดเฉพาะเครื่องนี้ ภายนอกเข้าผ่าน Cloudflare Tunnel hostname ที่สอง
      - "127.0.0.1:${OFFICE_PORT:-8080}:80"
    environment:
      # ทุกคำขอระหว่าง document server กับ File Center ต้องเซ็นด้วยความลับเดียวกัน
      JWT_ENABLED: "true"
      JWT_SECRET: ${OFFICE_JWT_SECRET:-}
      # document server ดาวน์โหลดไฟล์จาก http://file-center:3000 ซึ่งเป็น IP ภายในของ Docker (ค่าเริ่มต้นของ ONLYOFFICE ห้าม)
      ALLOW_PRIVATE_IP_ADDRESS: "true"
