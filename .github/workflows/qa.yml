# Checks on every push and pull request. No secrets are used. Actions are pinned to full versions.
name: qa

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # build, typecheck, every test with coverage, flaky re-run, route list check, budgets (scripts/qa/run-checks.ts)
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run qa --run-id ci-${{ github.run_id }}
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qa-results
          path: qa/results/
          if-no-files-found: warn

  # the seeded-defect check: only on main and by hand, it is slower and not needed for every branch
  seeded:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # the update tests need the built page (web/dist); without it they would not run and their planted bugs go unnoticed
      - run: bun --bun run build
      - run: bun run qa:seed check --run-id ci-seed
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qa-seeded-results
          path: qa/results/
          if-no-files-found: warn

  # the real image: non-root user, upload and download, update from the web, FC_RUN_AS_ROOT (scripts/ci-docker.sh)
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bash scripts/ci-docker.sh

  # the speed numbers (scripts/bench.ts, quick mode). Never fails on the numbers: runners differ; the file is for looking at.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun --bun run build
      - run: bun run bench --quick --json bench.json
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bench-results
          path: bench.json
          if-no-files-found: warn

  # known vulnerabilities, leaked secrets and Dockerfile mistakes (docs/security.md: "ตรวจช่องโหว่ใน CI"). Fails only for HIGH or
  # CRITICAL that has a fix available; every scan also leaves a SARIF file (all severities) in the artifact security-results.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # npm packages from bun.lock; exits non-zero for high and critical advisories
      - name: bun audit
        run: bun audit --audit-level=high
      - run: mkdir security-results

      # the repository: dependencies (bun.lock), secrets in files, Dockerfile misconfiguration.
      # The SARIF step comes first and never fails; the table step after it is the gate (exit-code 1).
      - name: Trivy repository (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          format: sarif
          output: security-results/trivy-fs.sarif
          trivyignores: .trivyignore
          exit-code: "0"
      - name: Trivy repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          trivyignores: .trivyignore
          exit-code: "1"
          skip-setup-trivy: true

      # the image built from the Dockerfile (OS packages of the base image and the app's packages inside it)
      - name: Build the image
        run: docker build -t file-center:security .
      - name: Trivy image (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: file-center:security
          scanners: vuln,secret
          ignore-unfixed: true
          format: sarif
          output: security-results/trivy-image.sarif
          trivyignores: .trivyignore
          exit-code: "0"
          skip-setup-trivy: true
      - name: Trivy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: file-center:security
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          trivyignores: .trivyignore
          exit-code: "1"
          skip-setup-trivy: true
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: security-results
          path: security-results/
          if-no-files-found: warn
