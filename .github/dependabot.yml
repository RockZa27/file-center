# Weekly pull requests for new versions. Dependabot opens them; nothing merges on its own: each needs CI green and a
# person to read it (docs/development.md). Actions and images are pinned by SHA / digest, which Dependabot keeps
# current together with the version comment or tag beside them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # majors that need code changes: taken on purpose, not from a weekly PR
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: pinia
        update-types: [version-update:semver-major]
      - dependency-name: vue-router
        update-types: [version-update:semver-major]
      - dependency-name: concurrently
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
